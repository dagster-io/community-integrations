[project]
name = "dagster-pixeltable"
description = "Dagster integration with Pixeltable"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.9.4",
    "pixeltable>=0.7.15",
    "pydantic>=2.11",
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "ty==0.0.37",
]

# ty configuration is inherited from the repository root pyproject.toml.

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dagster_pixeltable"]

[tool.setuptools.dynamic]
version = {attr = "dagster_pixeltable.__version__"}
