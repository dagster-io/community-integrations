[project]
name = "dagster-loguru"
description = "Capture Loguru log messages in Dagster's event log and UI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dagster>=1.8.0",
    "loguru>=0.7",
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "ty==0.0.37",
]

# ty configuration is inherited from the repository root pyproject.toml.

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dagster_loguru"]

[tool.setuptools.dynamic]
version = {attr = "dagster_loguru.__version__"}
