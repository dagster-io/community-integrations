plugins {
    id 'java-library'
    id 'application'
    id 'pmd'
    id 'checkstyle'
    id "com.vanniktech.maven.publish" version "0.30.0"
    id 'signing'
}

import com.vanniktech.maven.publish.SonatypeHost

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

mavenPublishing {
    coordinates("io.dagster", "pipes", "1.1.1")
    signAllPublications()

    publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL)

    pom {
        name = 'pipes'
        description = 'A java implementation of the dagster pipes protocol'
        url = 'github.com/dagster-io/community-integrations'
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }
        developers {
            developer {
                id = 'dagster-io'
                name = 'Dagster'
            }
        }
        scm {
            url = 'github.com/dagster-io/community-integrations'
            connection = 'scm:git://github.com/dagster-io/community-integrations.git'
            developerConnection = 'scm:git://github.com/dagster-io/community-integrations.git'
        }
    }
}

dependencyLocking {
    lockAllConfigurations()
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.22.4'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: '2.22'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.22.4'
    implementation 'info.picocli:picocli:4.7.6'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.6'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    implementation group: 'software.amazon.awssdk', name: 's3', version: '2.57.10'

    constraints {
        checkstyle('com.google.guava:guava:33.7.2-jre') {
            because 'GHSA-xxph-c9ww-hj94, GHSA-7g45-4rm6-3mm3, and GHSA-5mg8-w23w-74h3 affect the version checkstyle 8.29 pulls in'
        }
        checkstyle('commons-beanutils:commons-beanutils:1.11.0') {
            because 'GHSA-wxr5-93ph-8wr9 affects the version checkstyle 8.29 pulls in'
        }
        pmd('org.apache.commons:commons-lang3:3.18.0') {
            because 'GHSA-j288-q9x7-2f5v affects the version PMD 6.48.0 pulls in'
        }
    }
}

test {
    useJUnitPlatform()
}

tasks.register('testJar', Jar) {
    archiveClassifier.set("tests")
    from sourceSets.test.output
}
tasks.named('assemble') {
    dependsOn(tasks.named('testJar'))
}
application {
    mainClass.set('io.dagster.pipes.MainTest')
}
tasks.named('startScripts') {
    applicationName = "mainTest"
    classpath = files(tasks.jar.archiveFile) + files(tasks.testJar.archiveFile) + sourceSets.test.runtimeClasspath
}
distributions {
    main {
        contents {
            // copy our test classes jar file into the install dir
            from(tasks.named('testJar').flatMap { it.archiveFile }) {
                into 'lib'
            }
            // copy the test dependencies
            from(configurations.testRuntimeClasspath) {
                into 'lib'
                duplicatesStrategy = DuplicatesStrategy.EXCLUDE
            }
        }
    }
}

pmd {
    toolVersion = "6.48.0"
    consoleOutput = true
    pmdTest.enabled = false
}

checkstyle {
    toolVersion = '8.29'
    configFile = file('config/checkstyle/google_checks.xml')
}

checkstyleMain
    .exclude('**/types/**')

tasks.withType(Pmd).configureEach {
    // Exclude generated types files from analysis
    exclude '**/types/**'
    ruleSetFiles = files('config/pmd-ruleset.xml')
    ruleSets = [] // Disable default rulesets
}

tasks.withType(Checkstyle).configureEach {
    ignoreFailures = false
    reports {
        xml.required.set(false)
        html.required.set(true)
        html.outputLocation.set(file("$buildDir/reports/checkstyle/checkstyle.html"))
    }
    doLast {
        println "Checkstyle HTML report: file://$buildDir/reports/checkstyle/checkstyle.html"
    }
}
