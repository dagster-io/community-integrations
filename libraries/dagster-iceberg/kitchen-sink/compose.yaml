services:
  spark-iceberg:
    image: python-integration
    container_name: pyiceberg-spark
    build: .
    networks:
      iceberg_net:
    depends_on:
      - rest
      - hive
      - object-store
    volumes:
      - ./warehouse:/home/iceberg/warehouse
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    ports:
      - 8888:8888
      - 8080:8080
      - 15002:15002
    links:
      - rest:rest
      - hive:hive
      - object-store:object-store
  rest:
    image: apache/iceberg-rest-fixture
    container_name: pyiceberg-rest
    networks:
      iceberg_net:
    ports:
      - 8181:8181
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://object-store:9000
  object-store:
    image: rustfs/rustfs:1.0.0
    container_name: pyiceberg-object-store
    networks:
      iceberg_net:
        aliases:
          - warehouse.object-store
    ports:
      - 9001:9001
      - 9000:9000
    environment:
      - RUSTFS_ACCESS_KEY=admin
      - RUSTFS_SECRET_KEY=password
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=:9001
      - RUSTFS_SERVER_DOMAINS=object-store
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  aws-cli:
    image: amazon/aws-cli:2.37.2
    container_name: pyiceberg-aws-cli
    networks:
      iceberg_net:
    depends_on:
      object-store:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://object-store:9000
    entrypoint: /bin/sh
    command:
      - -c
      - "aws s3 mb s3://warehouse; tail -f /dev/null"
  hive:
    build: hive/
    container_name: hive
    hostname: hive
    networks:
      iceberg_net:
    ports:
      - 9083:9083
    environment:
      SERVICE_NAME: "metastore"
      SERVICE_OPTS: "-Dmetastore.warehouse.dir=s3a://warehouse/hive/"

networks:
  iceberg_net:
