[project]
name = "dagster-cloudflare"
description = "Dagster integration with Cloudflare: run launcher for Cloudflare Containers"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "liongkj", email = "khaijiet@hotmail.com" }]
license = { text = "Apache-2.0" }
dependencies = [
    "dagster>=1.9.0",
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "ty==0.0.37",
]

# ty configuration is inherited from the repository root pyproject.toml.

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dagster_cloudflare", "dagster_cloudflare.containers"]

[tool.setuptools.dynamic]
version = {attr = "dagster_cloudflare.__version__"}
